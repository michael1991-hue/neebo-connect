workflows:
  ios-app-store:
    name: Upload Nivvi to App Store Connect
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple
    environment:
      vars:
        BUNDLE_ID: com.michael1991.nivvi
        XCODE_PROJECT: Nivvi.xcodeproj
        XCODE_SCHEME: Nivvi
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare icons, sounds and Xcode project
        script: |
          python3 prepare-icons.py
          python3 prepare-sound.py
          xcodegen generate --spec project.yml
      - name: Set up keychain
        script: keychain initialize
      - name: Register bundle ID if needed
        script: |
          app-store-connect bundle-ids create "Nivvi" \
            --identifier "$BUNDLE_ID" \
            --platform IOS \
            --capabilities PUSH_NOTIFICATIONS \
            || true
          app-store-connect bundle-ids create "Nivvi Live Activity" \
            --identifier "$BUNDLE_ID.widget" \
            --platform IOS \
            || true
      - name: Create App Store certificate and profile
        script: |
          export CERTIFICATE_PRIVATE_KEY="$(cat apple/codemagic-distribution.pem)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --delete-stale-profiles \
            --certificate-key @file:apple/codemagic-distribution.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID.widget" \
            --type IOS_APP_STORE \
            --create \
            --delete-stale-profiles \
            --certificate-key @file:apple/codemagic-distribution.pem
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing to the Xcode project
        script: xcode-project use-profiles
      - name: Archive and export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=123"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - hello.nivvi@outlook.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
