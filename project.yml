name: Nivvi
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.michael1991.nivvi
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '104'
    CODE_SIGN_STYLE: Automatic
targets:
  Nivvi:
    type: application
    platform: iOS
    sources:
      - path: Nivvi.swift
      - path: MonitoringSupport.swift
      - path: FamilySharing.swift
      - path: PulseOximetry.swift
      - path: WiFiShare.swift
      - path: Atmosphere.swift
      - path: NivviLiveActivity.swift
      - path: LiveActivityPush.swift
      - path: LiveActivity/NivviActivityAttributes.swift
      - path: build/Assets.xcassets
        buildPhase: resources
      - path: Sounds
        buildPhase: resources
      - path: apple/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: apple/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: apple/FamilySharing.entitlements
    dependencies:
      - target: NivviLiveActivity
        embed: true
  NivviLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: '16.1'
    sources:
      - path: LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michael1991.nivvi.widget
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: apple/Widget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Nivvi:
    build:
      targets:
        Nivvi: all
        NivviLiveActivity: all
    archive:
      config: Release
