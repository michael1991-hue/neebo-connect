name: Nivvi
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    PRODUCT_BUNDLE_IDENTIFIER: com.michael1991.nivvi
    MARKETING_VERSION: '0.9.5'
    CURRENT_PROJECT_VERSION: '14'
    CODE_SIGN_STYLE: Automatic
targets:
  Nivvi:
    type: application
    platform: iOS
    sources:
      - path: Nivvi.swift
      - path: MonitoringSupport.swift
      - path: PulseOximetry.swift
      - path: build/Assets.xcassets
        buildPhase: resources
      - path: build/Payload/Nivvi.app/NivviSiren.wav
        buildPhase: resources
      - path: build/Payload/Nivvi.app/NivviRelief.wav
        buildPhase: resources
      - path: apple/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: apple/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Nivvi:
    build:
      targets:
        Nivvi: all
    archive:
      config: Release
