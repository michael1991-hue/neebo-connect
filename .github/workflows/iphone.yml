name: Build Nivvi for iPhone
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Nivvi.swift'
      - 'FamilySharing.swift'
      - 'family-server/**'
      - 'MonitoringSupport.swift'
      - 'PulseOximetry.swift'
      - 'prepare-sound.py'
      - 'build.sh'
      - 'prepare-icons.py'
      - 'Assets/**'
      - 'Tests/**'
      - 'apple/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/iphone.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Bluetooth, alarms and daily history regression checks
        run: bash Tests/run.sh
      - name: Compile iPhone app
        run: bash build.sh
      - name: Save IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Nivvi-unsigned
          path: build/Nivvi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate App Store archive structure without signing
        run: bash scripts/archive.sh
      - name: Save archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Nivvi-unsigned-archive
          path: build/Nivvi-unsigned.xcarchive
          if-no-files-found: error
          retention-days: 7

  family-access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r family-server/requirements.txt pytest
      - run: python -m pytest -q family-server/tests
