name: Build Nivvi for iPhone
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NeeboConnect.swift'
      - 'MonitoringSupport.swift'
      - 'prepare-sound.py'
      - 'build.sh'
      - 'prepare-icons.py'
      - 'Assets/**'
      - 'Tests/**'
      - '.github/workflows/iphone.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bluetooth, alarms and daily history regression checks
        run: bash Tests/run.sh
      - name: Compile iPhone app
        run: bash build.sh
      - name: Save IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Nivvi-unsigned
          path: build/Nivvi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

